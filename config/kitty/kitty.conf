# Shell -->
shell /usr/bin/zsh

# Brackground section -->
background_opacity 0.90
background_blur 1

# Shortcuts setion -->
clear && printf '\e[3J'

# Fonts section -->
font_family      family="DankMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Clipboard section -->
# map ctrl+c copy_to_clipboard
# map ctrl+v paste_from_clipboard

# Kill task -->
map ctrl+q close_window

# Kitty borders -->
hide_window_decorations yes
window_border_width 1.0pt

# Alias -->
alias emacs="emacs -nw"
